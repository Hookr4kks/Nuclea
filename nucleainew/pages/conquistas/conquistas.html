<!-- CONQUISTAS -->
<div class="panel panel-conquistas" id="p-conquistas">
  <div class="ach-wrap">
    <div class="ach-hero">
      <div class="ach-level-ring" id="ach-ring">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(108,142,245,0.15)" stroke-width="7"/>
          <circle id="ach-ring-arc" cx="40" cy="40" r="34" fill="none"
                  stroke="#6c8ef5" stroke-width="7" stroke-linecap="round"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6"
                  transform="rotate(-90 40 40)" style="transition:stroke-dashoffset .8s ease"/>
        </svg>
        <div class="ach-lvl-num" id="ach-lvl-num">1</div>
      </div>
      <div class="ach-hero-info">
        <div class="ach-hero-title" id="ach-hero-title">Iniciante</div>
        <div class="ach-hero-sub" id="ach-hero-sub">Seu nível atual</div>
        <div class="ach-xp-row">
          <div class="ach-xp-bar-track">
            <div class="ach-xp-bar-fill" id="ach-xp-fill" style="width:0%"></div>
          </div>
          <span class="ach-xp-label" id="ach-xp-label">0 / 100 XP</span>
        </div>
      </div>
      <div class="ach-hero-stats">
        <div class="ach-hstat">
          <div class="ach-hstat-val" id="ach-stat-unlocked">0</div>
          <div class="ach-hstat-lbl">desbloqueadas</div>
        </div>
        <div class="ach-hstat">
          <div class="ach-hstat-val" id="ach-stat-total">0</div>
          <div class="ach-hstat-lbl">no total</div>
        </div>
        <div class="ach-hstat">
          <div class="ach-hstat-val" id="ach-stat-xp">0</div>
          <div class="ach-hstat-lbl">XP total</div>
        </div>
      </div>
    </div>
    <div class="ach-filters" id="ach-filters">
      <button class="ach-filt on" onclick="achFilter('todos',this)">Todos</button>
      <button class="ach-filt" onclick="achFilter('desbloqueado',this)">Desbloqueados</button>
      <button class="ach-filt" onclick="achFilter('chat',this)">Chat</button>
      <button class="ach-filt" onclick="achFilter('flashcard',this)">Flashcards</button>
      <button class="ach-filt" onclick="achFilter('tarefa',this)">Tarefas</button>
      <button class="ach-filt" onclick="achFilter('agenda',this)">Agenda</button>
      <button class="ach-filt" onclick="achFilter('voz',this)">Voz</button>
    </div>
    <div class="ach-list" id="ach-list"></div>
  </div>
</div>
