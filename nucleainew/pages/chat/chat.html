<!-- CHAT -->
<div class="panel panel-chat on" id="p-chat">
  <div class="chat-col empty" id="chat-col">
    <div class="chat-greeting" id="chat-greeting">Boa tarde, Usuário!</div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-bar">
      <div class="chat-bar-inner">
        <div class="chat-img-preview" id="chat-img-preview"></div>
        <textarea class="chat-ta" id="chat-in" rows="1"
          placeholder="Como posso ajudar você hoje?"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'"
        ></textarea>
        <button class="chat-send-btn" id="btn-send" onclick="sendChat()" title="Enviar">➜</button>
        <input id="chat-img-input" type="file" accept="image/*" hidden onchange="pickChatImage(event)"/>
        <button class="chat-img-btn" type="button" onclick="document.getElementById('chat-img-input').click()" title="Anexar imagem">
          <span>+</span>
        </button>
      </div>
    </div>
  </div>
</div>
