<!-- AGENDA -->
<div class="panel panel-agenda" id="p-agenda">
  <div class="agenda-inner">
    <div class="agenda-left">
      <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:14px">
        <div class="cal-hd">
          <span class="cal-t" id="cal-ti"></span>
          <div class="cal-nav">
            <button class="cal-nb" onclick="chMon(-1)">&#8249;</button>
            <button class="cal-nb" onclick="chMon(1)">&#8250;</button>
          </div>
        </div>
        <div class="cal-g" id="cal-g"></div>
      </div>
    </div>
    <div class="agenda-right">
      <div class="add-evt">
        <div class="add-evt-title">Adicionar evento</div>
        <input class="field" id="ev-ti" placeholder="Título do evento" style="width:100%"/>
        <div class="form-row agenda-pick-row">
          <input id="ev-dt" type="hidden"/>
          <button class="field ag-pick-btn ag-pick-date" id="ev-dt-btn" type="button" onclick="toggleAgendaDatePick()"><span id="ev-dt-label">Escolher data</span></button>
          <input id="ev-tm" type="hidden"/>
          <button class="field ag-pick-btn ag-pick-time" id="ev-tm-btn" type="button" onclick="toggleAgendaTimePick()"><span id="ev-tm-label">Horário</span></button>
          <div class="ag-date-pop" id="ag-date-pop">
            <div class="agp-header">
              <button class="agp-nav" type="button" onclick="agDateChMon(-1)">&#8249;</button>
              <span class="agp-title" id="ag-date-title"></span>
              <button class="agp-nav" type="button" onclick="agDateChMon(1)">&#8250;</button>
            </div>
            <div class="agp-grid" id="ag-date-grid"></div>
            <div class="agp-footer">
              <button type="button" onclick="agDateToday()">Hoje</button>
            </div>
          </div>
          <div class="ag-time-pop" id="ag-time-pop"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="col-opts" id="col-opts"><span style="font-size:10px;color:var(--tx2)">Cor:</span></div>
          <button class="btn pr" onclick="addEvt()">+ Adicionar</button>
        </div>
      </div>
      <div class="evts-panel">
        <div class="evts-hd" id="evts-hd">Eventos de hoje</div>
        <div id="evts-list"></div>
      </div>
    </div>
  </div>
</div>
